<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0f3d2e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Dominó">
  <meta name="description" content="Dominó em dupla para 4 jogadores: você e sua parceira contra dois adversários.">
  <title>Dominó em Dupla</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app" class="table">
    <header class="topbar">
      <button class="icon-btn" id="menu-btn" aria-label="Menu">☰</button>
      <div class="scoreboard" aria-live="polite">
        <div class="team us"><span class="team-name">Nós</span><span class="team-score" id="score-us">0</span></div>
        <div class="score-sep">×</div>
        <div class="team them"><span class="team-score" id="score-them">0</span><span class="team-name">Eles</span></div>
      </div>
      <div class="round-tag" id="round-tag">Rodada 1</div>
    </header>

    <section class="seat seat-top" data-player="2"></section>

    <section class="middle">
      <div class="seat seat-left" data-player="3"></div>
      <div class="board" id="board" aria-label="Mesa"></div>
      <div class="seat seat-right" data-player="1"></div>
    </section>

    <section class="me">
      <div class="status" id="status" aria-live="polite"></div>
      <div class="hand" id="hand" role="group" aria-label="Suas pedras"></div>
    </section>
  </div>

  <dialog id="modal" class="modal">
    <div class="modal-body" id="modal-body"></div>
  </dialog>

  <script type="module" src="js/app.js"></script>
</body>
</html>

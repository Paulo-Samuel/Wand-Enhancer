name: Dominó em Dupla

on:
  push:
    paths:
      - 'domino-dupla/**'
      - '.github/workflows/domino-dupla.yml'
  pull_request:
    paths:
      - 'domino-dupla/**'
      - '.github/workflows/domino-dupla.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: domino-dupla
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm test

  # Publica só a pasta do jogo no GitHub Pages (Settings → Pages → Source: GitHub Actions).
  deploy:
    needs: test
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: domino-dupla
      - id: deployment
        uses: actions/deploy-pages@v4
